# PROPOSAL ONLY.
# Do not move this file into code-minion/code-minion.github.io/.github/workflows/.
# Site Engineer: copy it to .github/workflows/pages.yml in the NEW repo
# code-minion/site-nonprod, then enable Pages with build_type=workflow.
# Expected URL: https://code-minion.github.io/site-nonprod/
# See docs/platform/NONPROD.md.

name: Deploy nonprod GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-nonprod
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Optional. Empty or unset keeps the production BFF fallbacks in source.
          # Set these as Actions repository variables on site-nonprod only.
          VITE_BFF_CHAT_URL: ${{ vars.VITE_BFF_CHAT_URL }}
          VITE_BFF_HIGHSCORE_URL: ${{ vars.VITE_BFF_HIGHSCORE_URL }}
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        # Do not set preview: true. That flag is an internal alpha and is not
        # a public nonprod URL. This job must run only in repo site-nonprod.
